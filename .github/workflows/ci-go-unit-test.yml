name: ci-go-unit-test
on:
  pull_request:
    branches:
      - main
    paths:
      - "Makefile"
      - ".github/workflows/ci-go-unit-test.yml"
      - "apis/**"
      - "cmd/**"
      - "config/**"
      - "internal/**"
      - "pkg/**"
      - ".gitmodules"
      - "manifests/**"
      - "vArmor-ebpf/**" # check submodule content
permissions: read-all
jobs:
  go-unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Verify Mozilla CA bundle
        run: make verify-mozilla-bundle
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.25"
      - name: Get dependencies
        run: go mod tidy
      - name: Set up llvm and apparmor
        run: ./.github/scripts/toolchain.sh
      - name: Run Tests
        run: sudo go test -v ./...
