apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: varmor-networkproxy-demo
  labels:
    sandbox.varmor.org/enable: "true"
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
  containers:
  - name: client
    image: curlimages/curl:8.12.1
    command: [sh, -c, "sleep 3600"]
