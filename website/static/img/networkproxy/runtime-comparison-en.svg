<text x="637" y="430" class="small" text-anchor="middle">Application</text>
<text x="780" y="451" class="small" text-anchor="middle">TCP redirection</text>
<rect x="880" y="403" width="90" height="44" rx="10" fill="#dbf1eb" stroke="#83b5a9" stroke-width="1.6"/>
