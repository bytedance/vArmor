<title id="title">runc 与 Kata 中的 NetworkProxy</title>
<desc id="desc">两种运行时都在 Pod 内将业务 TCP 流量重定向到 Envoy。允许流量到达目标，拒绝流量在代理处终止。runc 由节点 Agent 记录审计，Kata 在虚拟机内的 sidecar 中记录审计。</desc>
<defs>
<marker id="traffic" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#147d68"/></marker>
<marker id="audit" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#b56a16"/></marker>
<marker id="config" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#68748c"/></marker>
</defs><rect width="1040" height="800" rx="16" fill="#ffffff"/>
<style>text{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;fill:#24334b} .title{font-size:23px;font-weight:700}.label{font-size:18px;font-weight:600}.small{font-size:16px}.note{font-size:15px;fill:#536176}</style>
