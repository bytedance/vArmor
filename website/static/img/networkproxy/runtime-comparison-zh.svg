<rect x="20" y="180" width="480" height="480" rx="10" fill="#f8fafc" stroke="#c9d3df" stroke-width="1.6"/>
<text x="44" y="216" class="title" text-anchor="start">Kubernetes 节点 · Runc</text>
<rect x="50" y="268" width="420" height="218" rx="10" fill="#edf5ff" stroke="#95b7df" stroke-width="1.6"/>
