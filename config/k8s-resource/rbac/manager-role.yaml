apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: varmor-manager
  namespace: varmor
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - patch
  - list
# Read-only access to the varmor-config ConfigMap for dynamic configuration
# (micro-VM detection rules) via an informer. resourceNames cannot scope list/watch,
# so this is namespace-wide but limited to the get/list/watch verbs.
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - patch
  - update
  - deletecollection
